name: uavdt
# UAVDT_ROOT must be exported by the caller (matches the VISDRONE_ROOT
# pattern in README.md) — no machine-specific absolute path is hardcoded
# here. The relative placeholder below only exists so a missing env var
# fails loudly and locally rather than resolving into some unrelated path.
root: ${UAVDT_ROOT:-../../data/UAVDT}
num_classes: 3
classes: [car, truck, bus]

splits: {train: {}, val: {}, test: {}}

adapters:
  esod:
    # Directory-based splits (EsodAdapter._split_input falls back to the
    # "images" key when no "list" key is present) — matches the actual
    # images/train + images/test layout. The old "list: split/*.txt" entries
    # pointed at list files that were never generated for this dataset,
    # which is why Block B failed with "Dataset not found."
    splits:
      train: {images: images/train}
      val: {images: images/test}
      test: {images: images/test}
  querydet:
    runner: visdrone
    splits:
      train:
        images: images/UAV-benchmark-M
        annotations: annotations/instances_UAVDTtrain.json
      val:
        images: images/UAV-benchmark-M
        annotations: annotations/instances_UAVDTval.json
      test:
        images: images/UAV-benchmark-M
        annotations: annotations/instances_UAVDTval.json
  ceasc:
    dataset_type: UAVDTDataset
    splits:
      train:
        images: images/UAV-benchmark-M
        annotations: annotations/instances_UAVDTtrain.json
      val:
        images: images/UAV-benchmark-M
        annotations: annotations/instances_UAVDTval.json
      test:
        images: images/UAV-benchmark-M
        annotations: annotations/instances_UAVDTval.json
