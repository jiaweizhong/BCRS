schema_version: 1
name: bcrs_semantic_only_uavdt_yolov5m

# UAVDT Semantic-Only / Coverage-Supervised Arm (E2.1u)
# Uses plain uavdt_yolov5m.yaml (Segmenter class, zero spectral evidence, identical architecture to E1.0u baseline)
# Coverage loss weight (lambda_cov=0.5, pos_weight=2.0) supervises tiny-object recall.

backend:
  name: esod
  root: vendor/esod
  python: ${BCRS_PYTHON:-python}

model:
  name: bcrs_semantic_only_uavdt_yolov5m
  config: vendor/esod/configs/models/uavdt_yolov5m.yaml
  weights: artifacts/pretrained/yolov5m.pt

dataset:
  config: configs/datasets/uavdt.yaml

runtime:
  output_dir: work_dirs/bcrs_semantic_only_uavdt_yolov5m
  devices: "0"
  workers: 8

train:
  epochs: 50
  batch_size: 8
  image_size: 1536
  hyp: vendor/esod/configs/hyps/hyp.uavdt.yaml
  hm_metric: false
  lambda_cov: 0.5
  pos_weight: 2.0

test:
  checkpoint: work_dirs/bcrs_semantic_only_uavdt_yolov5m/weights/best.pt
  batch_size: 1
  image_size: 1536
  sparse_head: true
  hm_metric: false
  save_json: true
  patch_budget: 64
