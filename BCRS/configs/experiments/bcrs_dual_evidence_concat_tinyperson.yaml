schema_version: 1
name: bcrs_dual_evidence_concat_tinyperson_yolov5m
backend: {name: esod, root: vendor/esod, python: "${BCRS_PYTHON:-python}"}
model:
  name: bcrs_dual_evidence_concat_yolov5m
  config: vendor/esod/configs/models/tinyperson_yolov5m_concat.yaml
  weights: artifacts/pretrained/yolov5m.pt
dataset: {config: configs/datasets/tinyperson.yaml}
runtime: {output_dir: work_dirs/bcrs_dual_evidence_concat_tinyperson_yolov5m, devices: "0", workers: 8}
train:
  epochs: 50
  batch_size: 8
  image_size: 1536
  hyp: vendor/esod/configs/hyps/hyp.uavdt.yaml
  coverage_loss_weight: 0.5
  pos_weight: 2.0
test:
  checkpoint: work_dirs/bcrs_dual_evidence_concat_tinyperson_yolov5m/weights/best.pt
  batch_size: 1
  image_size: 1536
  sparse_head: true
