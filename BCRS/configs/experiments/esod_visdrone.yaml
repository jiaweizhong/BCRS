schema_version: 1
name: esod_visdrone_yolov5m

backend:
  name: esod
  root: vendor/esod
  python: ${BCRS_PYTHON:-python}

model:
  name: esod_yolov5m
  config: vendor/esod/configs/models/visdrone_yolov5m.yaml
  weights: artifacts/pretrained/yolov5m.pt

dataset:
  config: configs/datasets/visdrone.yaml

runtime:
  output_dir: work_dirs/esod_visdrone_yolov5m
  devices: "0"
  workers: 8

train:
  epochs: 50
  batch_size: 8
  image_size: 1536
  hyp: vendor/esod/configs/hyps/hyp.visdrone.yaml
  hm_metric: true

test:
  checkpoint: work_dirs/esod_visdrone_yolov5m/weights/best.pt
  batch_size: 8
  image_size: 1536
  sparse_head: false
  hm_threshold: 0.5
  hm_metric: false
  save_json: true
