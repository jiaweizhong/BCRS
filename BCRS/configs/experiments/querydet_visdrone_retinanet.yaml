schema_version: 1
name: querydet_visdrone_retinanet_r50

backend:
  name: querydet
  root: vendor/querydet
  python: ${BCRS_PYTHON:-python}

model:
  name: retinanet_r50
  config: vendor/querydet/configs/visdrone/retinanet_train.yaml
  weights: detectron2://ImageNetPretrained/MSRA/R-50.pkl

dataset: {config: configs/datasets/visdrone.yaml}
runtime: {output_dir: work_dirs/querydet_visdrone_retinanet_r50, devices: "0", workers: 4}

train: {config_options: []}
test:
  model_config: vendor/querydet/configs/visdrone/retinanet_test.yaml
  checkpoint: work_dirs/querydet_visdrone_retinanet_r50/model_final.pth
  config_options: []
