schema_version: 1
name: esod_uavdt_yolov5m
backend: {name: esod, root: vendor/esod, python: "${BCRS_PYTHON:-python}"}
model:
  name: esod_yolov5m
  config: vendor/esod/configs/models/uavdt_yolov5m.yaml
  weights: artifacts/pretrained/yolov5m.pt
dataset: {config: configs/datasets/uavdt.yaml}
runtime: {output_dir: work_dirs/esod_uavdt_yolov5m, devices: "0", workers: 8}
train:
  epochs: 50
  batch_size: 8
  image_size: 1536
  hyp: vendor/esod/configs/hyps/hyp.uavdt.yaml
test:
  checkpoint: work_dirs/esod_uavdt_yolov5m/weights/best.pt
  batch_size: 1
  image_size: 1536
  sparse_head: true
