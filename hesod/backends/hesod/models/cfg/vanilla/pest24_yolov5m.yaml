# parameters
# Pest24 A0: dense YOLOv5m, no sparse selector/patch routing at all -- the
# accuracy-oriented dense reference (HESOD-Agri-Proposal.md SS5's A0 row;
# HESOD-Agri-Experiment-Plan.md SS6.1). Identical nc/anchors/depth_multiple/
# width_multiple/SPP-kernel to models/cfg/esod/pest24_yolov5m.yaml -- only the
# DWConv+Segmenter+HeatMapParser 3-layer insert is removed and downstream
# layer indices renumbered accordingly, so this isolates exactly one variable
# (routing vs. no routing) against the R0 sparse baseline. SPP kernel kept at
# [3,5,7] (matching the esod pattern) rather than the generic vanilla
# template's stock [5,9,13] (see models/cfg/vanilla/visdrone_yolov5m.yaml) --
# using [5,9,13] here would silently introduce a second confound alongside
# the routing-vs-no-routing comparison this arm exists to isolate.
nc: 24  # number of classes
depth_multiple: 0.67  # model depth multiple
width_multiple: 0.75  # layer channel multiple

# anchors 1024 -- identical to esod/pest24_yolov5m.yaml
anchors:
 - [14,16,  22,26,  40,21]  # P3/8
 - [37,30,  24,46,  56,26]  # P4/16
 - [40,48,  85,59,  144,114]  # P5/32

# YOLOv5 backbone (no Segmenter/HeatMapParser -- dense, full-image)
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 9, C3, [256]],

   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 1, SPP, [1024, [3, 5, 7]]],
   [-1, 3, C3, [1024, False]],  # 9
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 13

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 17 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 14], 1, Concat, [1]],  # cat head P4
   [-1, 3, C3, [512, False]],  # 20 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 10], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3, [1024, False]],  # 23 (P5/32-large)

   [[17, 20, 23], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]
