# parameters
# SeaPerson (aka TinyPersonV2) channel-pooled spectral-only arm. Same as
# seaperson_yolov5m_spectral_only.yaml except ChannelPooledSpectralOnlySegmenter
# instead of SpectralOnlySegmenter (channel-pooled 2-channel spectral filter,
# same pooling trick concat-only/gated-fusion already use, vs. spectral-only's
# full-width, unpooled branch -- the reason spectral-only alone needed
# batch=2, HESOD-Experiment-Plan.md SS8).
#
# Added to isolate a confound in spectral-only's own strong result (recall
# on par with semantic-only, SS8.1): spectral-only is simultaneously the
# only "spectral evidence alone" arm AND the only unpooled/full-capacity
# arm in this roster, so its accuracy could come from either (a) spectral
# evidence genuinely being sufficient on its own, or (b) the extra channel
# capacity from skipping pooling -- these are confounded, not tested
# separately, in spectral-only's own result. This arm holds evidence
# source fixed (spectral only, still) and pools it the same way
# concat-only does, isolating the capacity/pooling variable directly:
# if recall holds up close to spectral-only's, that supports (a); if it
# drops substantially, that supports (b). Run with --selector-loss coverage
# --box-loss upstream. Pooling should also let this train at the shared
# batch=8, not spectral-only's forced batch=2.
nc: 1  # number of classes
depth_multiple: 0.67  # model depth multiple
width_multiple: 0.75  # layer channel multiple
# anchors  2048
anchors:
  - [5,8,  7,15,  11,12]  # P3/8
  - [10,22,  18,21,  19,43]  # P4/16
  - [34,33,  45,73,  86,163]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 9, C3, [256]],

   [-1, 1, DWConv, [256, 13, 1]],
   [[-1], 1, ChannelPooledSpectralOnlySegmenter, [1]],
   [[4, -1], 1, HeatMapParser, [256, 8, 0.5]],  # 7

   [-1, 1, Conv, [512, 3, 2]],  # 8-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 10-P5/32
   [-1, 1, SPP, [1024, [3, 5, 7]]],
   [-1, 3, C3, [1024, False]],  # 12
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 9], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 16

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 7], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 20 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 17], 1, Concat, [1]],  # cat head P4
   [-1, 3, C3, [512, False]],  # 23 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 13], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3, [1024, False]],  # 26 (P5/32-large)

   [[20, 23, 26], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]
