# parameters
# SeaDronesSeeV2 channel-pooled concat selector + ISPPHead (H1b, HESOD-
# Lightweight-Detector-Review-and-Roadmap.md SS5.2) -- identical to
# seadronesseev2_yolov5m_channel_pooled_concat.yaml except the Detect head
# swap. On TinyPerson concat+SABL (SS5.2's own "H1a/H1b 实测结果", 2026-08-19)
# ISPPHead held accuracy flat (mAP50:95 0.231=0.231, Very Tiny recall
# 76.75% vs 76.72%) while cutting GFLOPs 21.5% and dropping batch=1 latency
# 12.4ms->11.7ms -- the only one of the two lightweight-head candidates that
# didn't cost real accuracy. Testing here to see if that holds on a third,
# structurally different dataset. Run with the same --selector-loss coverage
# --lambda-cov 0.5 --pos-weight 2.0 --box-loss sabl flags as
# seadronesseev2_concat_sabl.
nc: 5  # number of classes
depth_multiple: 0.67  # model depth multiple
width_multiple: 0.75  # layer channel multiple
# anchors seeded from visdrone_yolov5m.yaml (1536 scale) -- autoanchor will adapt
anchors:
  - [6,8,    10,22,  19,15]  # P3/8
  - [19,32,  39,22,  32,47]  # P4/16
  - [74,38,  65,74,  136,112]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3]],  # 0-P1/2 ~ RF=(2-1)*1+3=4
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4 ~ RF=(4-1)*2+3=9
   [-1, 3, C3, [128]],  # RF=9+2*(3*0.33)=9+2=11  or  9+6=15
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8 ~ RF=(11-1)*2+3=23  or (15-1)*2+3=31
   [-1, 9, C3, [256]],  # RF=23+2*(9*0.33)=23+6=29  or 31+18=49

   [-1, 1, DWConv, [256, 13, 1]],
   [[-1], 1, ChannelPooledConcatEvidenceSegmenter, [1]],
   [[4, -1], 1, HeatMapParser, [256, 8, 0.5]],  # 7

   [-1, 1, Conv, [512, 3, 2]],  # 8-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 10-P5/32
   [-1, 1, SPP, [1024, [3, 5, 7]]],  # 5,9,13
   [-1, 3, C3, [1024, False]],  # 12
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 9], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 16

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 7], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 20 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 17], 1, Concat, [1]],  # cat head P4
   [-1, 3, C3, [512, False]],  # 23 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 13], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3, [1024, False]],  # 26 (P5/32-large)

   [[20, 23, 26], 1, Detect, [nc, anchors, 'ISPPHead']],  # Detect(P3, P4, P5)
  ]
