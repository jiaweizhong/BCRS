# parameters
# TinyPerson reliability-aware residual gate (F5/F6, HESOD-Agri-Proposal.md
# SS4.2). Identical to tinyperson_yolov5m.yaml except the Segmenter ->
# ReliabilityGateEvidenceSegmenter swap -- same pattern as
# pest24_yolov5m_reliability_gate.yaml, applied to TinyPerson's own
# nc/anchors/depth/width. Pest24's fusion-ladder verdict (HESOD-Agri-
# Experiment-Plan.md SS11.2.6/SS11.2.8) found the gate did not beat the
# capacity-matched concat control there; this arm re-tests that question on
# a dataset the routing thesis is expected to favor (SS11.2.9's Pest24
# A0-vs-routed finding motivates re-testing on higher-native-resolution data
# before concluding the gate mechanism itself is not worthwhile).
nc: 1  # number of classes
depth_multiple: 0.67  # model depth multiple
width_multiple: 0.75  # layer channel multiple
# anchors  2048
anchors:
  - [5,8,  7,15,  11,12]  # P3/8
  - [10,22,  18,21,  19,43]  # P4/16
  - [34,33,  45,73,  86,163]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3]],  # 0-P1/2 ~ RF=(2-1)*1+3=4
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4 ~ RF=(4-1)*2+3=9
   [-1, 3, C3, [128]],  # RF=9+2*(3*0.33)=9+2=11  or  9+6=15
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8 ~ RF=(11-1)*2+3=23  or (15-1)*2+3=31
   [-1, 9, C3, [256]],  # RF=23+2*(9*0.33)=23+6=29  or 31+18=49

   [-1, 1, DWConv, [256, 13, 1]],
   [[-1], 1, ReliabilityGateEvidenceSegmenter, [1]],
   [[4, -1], 1, HeatMapParser, [256, 16, 0.5]],  # 7, from 4 or 5? : 4. ratio=16 (1/16 patch grid) per ESOD.pdf's own ablation recommendation for TinyPerson's sparse, extremely-small objects -- 8 (1/8) is the paper's VisDrone choice, not TinyPerson's.

   [-1, 1, Conv, [512, 3, 2]],  # 8-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 10-P5/32
   [-1, 1, SPP, [1024, [3, 5, 7]]],  # 5,9,13
   [-1, 3, C3, [1024, False]],  # 12
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 9], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 16

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 7], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 20 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 17], 1, Concat, [1]],  # cat head P4
   [-1, 3, C3, [512, False]],  # 23 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 13], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3, [1024, False]],  # 26 (P5/32-large)

   [[20, 23, 26], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]
