# parameters
# SeaPerson fusion-rule-only probe (2026-09-02): same architecture as
# seaperson_yolov5m_channel_pooled_concat.yaml (arm 5, Dual-Concat) except
# the Segmenter swap -- ChannelPooledMaxEvidenceSegmenter (torch.max in
# logit space) instead of ChannelPooledConcatEvidenceSegmenter's learned
# 1x1 combiner. No SABL, no ISPPHead -- isolates the fusion rule's own
# effect, mirroring UAVDT's own uavdt_yolov5m_channel_pooled_max.yaml (arm
# 9) exactly.
#
# Motivation: arm (9) HESOD (Full), max fusion (HESOD-Experiment-Plan.md
# SS4.5) swapped max into arm (8)'s FULL recipe (SABL+ISPPHead included)
# and lost on every metric -- but that result can't separate "max fusion
# itself is worse here" from "max interacts badly with SABL/ISPPHead
# specifically", the same confound UAVDT hit before its own arm 9 (fusion-
# only) isolated it. This arm is that isolation for SeaPerson: does max
# fusion alone beat/match/lose to arm (5) Dual-Concat (0.772 mAP@.5, the
# roster's own peak), independent of SABL/ISPPHead? Run with the same
# --selector-loss coverage --box-loss upstream flags as arm (5). Preserves
# SeaPerson's own DWConv-before-selector + threshold=0.5 architecture
# deltas exactly (not UAVDT's SPP + threshold=0.3).
nc: 1  # number of classes
depth_multiple: 0.67  # model depth multiple
width_multiple: 0.75  # layer channel multiple
# anchors  2048
anchors:
  - [5,8,  7,15,  11,12]  # P3/8
  - [10,22,  18,21,  19,43]  # P4/16
  - [34,33,  45,73,  86,163]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3]],  # 0-P1/2 ~ RF=(2-1)*1+3=4
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4 ~ RF=(4-1)*2+3=9
   [-1, 3, C3, [128]],  # RF=9+2*(3*0.33)=9+2=11  or  9+6=15
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8 ~ RF=(11-1)*2+3=23  or (15-1)*2+3=31
   [-1, 9, C3, [256]],  # RF=23+2*(9*0.33)=23+6=29  or 31+18=49

   [-1, 1, DWConv, [256, 13, 1]],
   [[-1], 1, ChannelPooledMaxEvidenceSegmenter, [1]],
   [[4, -1], 1, HeatMapParser, [256, 8, 0.5]],  # 7, from 4 or 5? : 4

   [-1, 1, Conv, [512, 3, 2]],  # 8-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 10-P5/32
   [-1, 1, SPP, [1024, [3, 5, 7]]],  # 5,9,13
   [-1, 3, C3, [1024, False]],  # 12
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 9], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 16

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 7], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 20 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 17], 1, Concat, [1]],  # cat head P4
   [-1, 3, C3, [512, False]],  # 23 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 13], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3, [1024, False]],  # 26 (P5/32-large)

   [[20, 23, 26], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]
