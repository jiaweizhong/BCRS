# parameters
# UAVDT channel-pooling-isolation probe (2026-09-06): identical to
# uavdt_yolov5m_channel_pooled_max.yaml (arm 9, Concat-Max) except the
# spectral branch inside the Segmenter -- full-width SpectralBranch instead
# of ChannelPooledSpectralBranch. Cross-dataset counterpart to SeaPerson's
# own seaperson_yolov5m_max.yaml, added for the same reason: isolates
# channel pooling's own effect on the Max fusion rule specifically, never
# tested before (only tested on spectral-only/Concat -- HESOD-Experiment-
# Plan.md SS3.4 point 1, arm 3 vs arm 4). That single-evidence comparison
# is NOT a safe proxy for what happens under Max fusion, and points the
# opposite direction from SeaPerson's own motivating hypothesis: on UAVDT,
# pooled (arm 4) actually beats non-pooled (arm 3) on Total Recall/BPR
# (91.93% vs 88.83%, BPR 0.963 vs 0.936) -- but judged on the metric that
# actually matters (mAP, not recall), pooled is uniformly WORSE (mAP@.5
# 0.394 vs 0.396, mAP@.5:.95 0.209 vs 0.214) and does not save FLOPs either
# (99.3 vs 98.1 GFLOPs) -- so pooling's recall edge there doesn't cash out.
# This arm settles whether the same holds under Max fusion specifically.
# Run with the same --selector-loss coverage --lambda-cov 0.5 --pos-weight
# 2.0 --box-loss upstream --workers 2 flags as arm 9, only the fusion rule's
# spectral-branch resolution differs. Full-width SpectralBranch may need
# the same --batch-size 2 override arm (3) Spectral-only used (untested
# here; UAVDT's smaller img-size (1280 vs SeaPerson's 2048) made it
# unnecessary for arm 3, but the interaction with the semantic branch
# running alongside it in the same Segmenter here is new). Preserves
# UAVDT's own SPP layer + threshold=0.3 architecture deltas exactly.
nc: 3  # number of classes
depth_multiple: 0.67  # model depth multiple
width_multiple: 0.75  # layer channel multiple

# anchors  1024
anchors:
 - [14,16,  22,26,  40,21]  # P3/8
 - [37,30,  24,46,  56,26]  # P4/16
 - [40,48,  85,59,  144,114]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3]],  # 0-P1/2 ~ RF=(2-1)*1+3=4
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4 ~ RF=(4-1)*2+3=9
   [-1, 3, C3, [128]],  # RF=9+2*(3*0.33)=9+2=11  or  9+6=15
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8 ~ RF=(11-1)*2+3=23  or (15-1)*2+3=31
   [-1, 9, C3, [256]],  # RF=23+2*(9*0.33)=23+6=29  or 31+18=49

   [-1, 1, SPP, [256, [5, 9, 13]]],
   [[-1], 1, MaxEvidenceSegmenter, [1]],
   [[4, -1], 1, HeatMapParser, [256, 8, 0.3]],  # 7, from 4 or 5? : 4.

   [-1, 1, Conv, [512, 3, 2]],  # 8-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 10-P5/32
   [-1, 1, SPP, [1024, [3, 5, 7]]],  # 5,9,13
   [-1, 3, C3, [1024, False]],  # 12
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 9], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 16

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 7], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 20 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 17], 1, Concat, [1]],  # cat head P4
   [-1, 3, C3, [512, False]],  # 23 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 13], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3, [1024, False]],  # 26 (P5/32-large)

   [[20, 23, 26], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]
