# parameters
# SeaPerson decisive experiment (2026-09-06): Spectral-only (pooled) +
# ISPPHead, staged. Identical to
# seaperson_yolov5m_channel_pooled_spectral_only.yaml (arm 4) except the
# Detect head -- 'ISPPHead' instead of the coupled head.
#
# Purpose: cross-dataset counterpart to uavdt_yolov5m_channel_pooled_
# spectral_only_isphead.yaml -- see that file's header for the full
# rationale. Spectral-only (channel-pooled) is one of the only components
# cleanly, stably positive on BOTH datasets (SeaPerson: +2.0pp mAP@.5 /
# +3.35pp recall over R0; UAVDT: +1.1pp mAP@.5 / +3.66pp recall). Run
# staged: warm-start from the already-converged
# seaperson_yolov5m_channel_pooled_spectral_only checkpoint (arm 4), freeze
# the trunk, fine-tune ISPPHead only -- same recipe as the pooled
# Max+ISPPHead staged fine-tune already built for SeaPerson
# (run_seaperson_frozen_selector.sh). Compared directly against the best
# Dual-evidence (Concat/Max + ISPPHead, staged) result to decide whether
# the semantic branch and its fusion machinery are worth keeping in the
# paper's final story, or whether a single-evidence spectral-routing recipe
# is the cleaner, equally (or more) effective choice.
nc: 1  # number of classes
depth_multiple: 0.67  # model depth multiple
width_multiple: 0.75  # layer channel multiple
# anchors  2048
anchors:
  - [5,8,  7,15,  11,12]  # P3/8
  - [10,22,  18,21,  19,43]  # P4/16
  - [34,33,  45,73,  86,163]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 9, C3, [256]],

   [-1, 1, DWConv, [256, 13, 1]],
   [[-1], 1, ChannelPooledSpectralOnlySegmenter, [1]],
   [[4, -1], 1, HeatMapParser, [256, 8, 0.5]],  # 7

   [-1, 1, Conv, [512, 3, 2]],  # 8-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 10-P5/32
   [-1, 1, SPP, [1024, [3, 5, 7]]],
   [-1, 3, C3, [1024, False]],  # 12
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 9], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 16

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 7], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 20 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 17], 1, Concat, [1]],  # cat head P4
   [-1, 3, C3, [512, False]],  # 23 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 13], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3, [1024, False]],  # 26 (P5/32-large)

   [[20, 23, 26], 1, Detect, [nc, anchors, 'ISPPHead']],  # Detect(P3, P4, P5)
  ]
