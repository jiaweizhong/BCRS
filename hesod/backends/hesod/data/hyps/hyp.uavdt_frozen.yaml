# Hyperparameters for the frozen-selector fine-tune probe
# (run_uavdt_frozen_selector.sh, HESOD-Experiment-Plan.md SS3.6). Identical
# to hyp.uavdt.yaml except lr0 (0.01 -> 0.001, a 10x cut) and warmup_epochs
# (3.0 -> 1.0).
#
# Root cause, revised again (2026-09-04): THREE successive collapses now.
# lr0=0.01/warmup_epochs=3.0 -> collapsed exactly at epoch 3. lr0=0.001/
# warmup_epochs=1.0 -> collapsed exactly at epoch 1. lr0=0.001/
# warmup_epochs=0.0 (warmup disabled entirely) -> collapsed at epoch 0,
# immediately -- WORSE, not better. This rules out "warmup-end transition
# timing" as the cause: the trigger is being in the post-warmup regime AT
# ALL, not the moment of transitioning into it. That regime (gated by the
# same `warmup_flag` in train.py ~line 622-654, 687, 779-780) sets
# `use_gt=False` (no ground-truth-assisted candidate routing) and
# `conf_thres=0.001` (vs. 0.1 during warmup, ~100x more permissive) --
# every collapse happens once the model has to rely on the frozen
# selector's own predictions at that permissive threshold, training a
# fresh SABL head. Next test: keep warmup_epochs LARGER than the total
# epoch budget (25 > 20) so `warmup_flag` never goes False for the entire
# run -- training stays in the use_gt=True/conf_thres=0.1 regime
# throughout. Caveat this doesn't fully resolve: test.py's own standalone
# eval (run after training) always uses conf_thres=0.001 regardless of
# how the model was trained -- if the collapse is really about that
# permissive threshold overwhelming a SABL head trained on the frozen
# trunk's real candidates, staying in warmup throughout TRAINING might
# just defer, not prevent, the same failure showing up at eval time. Test
# with a cheap EPOCHS=2 override first (not the full 20) to get this read
# in ~15-20 min instead of another 2-3 hour commitment.
lr0: 0.001  # initial learning rate -- 10x lower than scratch training (hyp.uavdt.yaml's 0.01), for fine-tuning a converged checkpoint
lrf: 0.1  # final OneCycleLR learning rate (lr0 * lrf)
momentum: 0.937  # SGD momentum/Adam beta1
weight_decay: 0.0005  # optimizer weight decay 5e-4
warmup_epochs: 25.0  # larger than any EPOCHS budget used with this hyp file -- keeps warmup_flag True (use_gt=True, conf_thres=0.1) for the entire run, see header
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr
box: 0.05  # box loss gain
cls: 20.0  # cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 1.0  # obj loss gain (scale with pixels)
obj_pw: 1.0  # obj BCELoss positive_weight
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold
# anchors: 3  # anchors per output layer (0 to ignore)
fl_gamma: 1.5  # focal loss gamma (efficientDet default gamma=1.5)
hsv_h: 0.2  # image HSV-Hue augmentation (fraction)
hsv_s: 0.5  # image HSV-Saturation augmentation (fraction)
hsv_v: 0.4  # image HSV-Value augmentation (fraction)
degrees: 0.2  # image rotation (+/- deg)
translate: 0.2  # image translation (+/- fraction)
scale: 0.5  # image scale (+/- gain)
shear: 0.02  # image shear (+/- deg)
perspective: 0.0  # image perspective (+/- fraction), range 0-0.001
flipud: 0.0  # image flip up-down (probability)
fliplr: 0.5  # image flip left-right (probability)
mosaic: 1.0  # image mosaic (probability)
mixup: 0.2  # image mixup (probability)
pixl: 0.2  # pixl loss gain
