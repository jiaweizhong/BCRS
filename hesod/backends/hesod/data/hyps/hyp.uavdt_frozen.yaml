# Hyperparameters for the frozen-selector fine-tune probe
# (run_uavdt_frozen_selector.sh, HESOD-Experiment-Plan.md SS3.6). Identical
# to hyp.uavdt.yaml except lr0 (0.01 -> 0.001, a 10x cut) and warmup_epochs
# (3.0 -> 1.0).
#
# Root cause, revised (2026-09-04): two successive collapses (lr0=0.01/
# warmup_epochs=3.0 -> collapsed exactly at epoch 3; lr0=0.001/
# warmup_epochs=1.0 -> collapsed exactly at epoch 1) show the trigger is
# not the absolute LR magnitude -- it is the warmup-end TRANSITION itself,
# which is gated by the same `warmup_flag` in train.py (~line 622-654,
# 687, 779-780) that ALSO controls two other things simultaneously:
# ground-truth-assisted candidate routing (`use_gt=True` during warmup,
# masks passed to the loss) and the candidate confidence threshold
# (`conf_thres=0.1` during warmup, a strict gate on which selector
# predictions get processed -> `conf_thres=0.001` after, ~100x more
# permissive). This bootstrap-then-wean schedule is designed for a
# randomly-initialized selector that needs GT help to start routing
# sensibly -- irrelevant here, since arm 9's selector is already converged
# and frozen. Every prior collapse happened right where warmup_flag flips
# False: GT assistance vanishes and a flood of previously-filtered
# low-confidence candidates hits a head still adapting to SABL loss,
# apparently pushing objectness to collapse. Fix: disable warmup entirely
# (warmup_epochs=0) so `nw=-1` and warmup_flag is False for the whole run
# -- training starts directly in the "real" (use_gt=False,
# conf_thres=0.001) regime from epoch 0, no discontinuous transition
# anywhere. lr0 stays at the reduced 0.001 (vs. hyp.uavdt.yaml's
# from-scratch 0.01) since fine-tuning a converged checkpoint still
# warrants a gentler rate even without the warmup-transition issue.
lr0: 0.001  # initial learning rate -- 10x lower than scratch training (hyp.uavdt.yaml's 0.01), for fine-tuning a converged checkpoint
lrf: 0.1  # final OneCycleLR learning rate (lr0 * lrf)
momentum: 0.937  # SGD momentum/Adam beta1
weight_decay: 0.0005  # optimizer weight decay 5e-4
warmup_epochs: 0.0  # disabled -- see header. Fine-tuning a converged, frozen-trunk checkpoint doesn't need GT-assisted bootstrap, and the warmup-end transition is what was collapsing training
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr
box: 0.05  # box loss gain
cls: 20.0  # cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 1.0  # obj loss gain (scale with pixels)
obj_pw: 1.0  # obj BCELoss positive_weight
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold
# anchors: 3  # anchors per output layer (0 to ignore)
fl_gamma: 1.5  # focal loss gamma (efficientDet default gamma=1.5)
hsv_h: 0.2  # image HSV-Hue augmentation (fraction)
hsv_s: 0.5  # image HSV-Saturation augmentation (fraction)
hsv_v: 0.4  # image HSV-Value augmentation (fraction)
degrees: 0.2  # image rotation (+/- deg)
translate: 0.2  # image translation (+/- fraction)
scale: 0.5  # image scale (+/- gain)
shear: 0.02  # image shear (+/- deg)
perspective: 0.0  # image perspective (+/- fraction), range 0-0.001
flipud: 0.0  # image flip up-down (probability)
fliplr: 0.5  # image flip left-right (probability)
mosaic: 1.0  # image mosaic (probability)
mixup: 0.2  # image mixup (probability)
pixl: 0.2  # pixl loss gain
