# Hyperparameters for SeaPerson -- copied verbatim from hyp.tinyperson.yaml
# (closest analog: same schema, same tiny-person-detection domain, same
# release lineage -- SeaPerson is aka TinyPersonV2). No SeaPerson-specific
# paper protocol exists to deviate toward (unlike TinyPerson's own
# paper-text-vs-released-code split), so this is a plain copy, not a second
# profile. Revisit once a real baseline result exists.
lr0: 0.01
lrf: 0.2
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
pixl: 0.4
