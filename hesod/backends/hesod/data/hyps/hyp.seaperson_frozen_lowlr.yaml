# SeaPerson staged/frozen-selector fine-tune hyp, low-LR variant (2026-09-07).
# Isolates the LR-magnitude lever from the warmup-length lever tested in
# hyp.seaperson_frozen.yaml. That variant (warmup_epochs=20, covering the
# whole 20-epoch fine-tune) avoided the epoch-1/2 collapse but converged
# to a flat plateau (val mAP@.5 ~0.766-0.771) within 3-4 epochs and never
# moved for the remaining 16 -- not undertrained, genuinely converged at
# that setting. This variant tests whether the crash was really about
# warmup *length* or about the *magnitude* of the post-warmup LR jump:
# keep warmup short (close to the original hyp.seaperson.yaml's 2.0,
# nudged to 3.0 for a small safety margin) but lower the target lr0 10x
# (0.01 -> 0.001) so the jump itself is gentler, testing whether the model
# can then converge past the 0.766-0.771 plateau toward the pre-staging
# 0.778/0.812 (test/val) ceiling.
lr0: 0.001
lrf: 0.2
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
pixl: 0.4
